; 仓库级 pytest 配置
; 仅收集 testpaths 列出的测试目录，
; 避免误收集 test_monitor/test_monitor.py (运行时监控脚本，
; 顶层导入 playwright/schedule/requests，被收集会导致 ImportError 或副作用)
[pytest]
testpaths =
    claudecode-analysis-engine/tests
    基础竞品分析工具/tests
    关键字数据汇总/tests
    竞品分析平滑度数据显示工具/tests
norecursedirs = test_monitor .venv .verify_venv
