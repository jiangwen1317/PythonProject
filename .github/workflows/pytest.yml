# 仓库内机械门：推送/PR 时自动运行 python -m pytest，失败即检查不通过
# 与 .githooks/pre-commit 本地钩子（需手动启用）互补，本工作流随克隆推送即生效
# 注意：要让失败真正"阻断合并"，还需在 GitHub 侧开启分支保护并将本检查设为必需
# （外部写操作，需单独授权，本仓库内不做）
name: pytest

on:
  push:
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pytest.ini 的 testpaths 仅收集三个纯逻辑测试目录，
      # 测试链只依赖标准库 + pytest，无需安装各工具的 GUI/绘图依赖
      - name: Install pytest
        run: python -m pip install pytest

      - name: Run pytest
        run: python -m pytest
